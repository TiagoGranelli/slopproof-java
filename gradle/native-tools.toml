# Native CLIs that the gates run (see build-logic/.../slopproof.external-tools.gradle.kts).
#
# Gradle downloads each pinned release once into $GRADLE_USER_HOME/slopproof-tools, checks its SHA-256
# against this file, and runs it. Nothing is installed system-wide, and no Docker, WSL or Node is needed.
#
# Layout: one [tool] table (version, released) and one [tool.<platform>] table per platform, with:
#   url     https://github.com/... release asset (the -Pslopproof.tools.mirror option rewrites this prefix)
#   sha256  64 hex characters of the asset, from the release checksums file or sha256sum
#   entry   path of the executable inside a .zip or .tar.gz asset; omit it for a plain executable
# Platforms: windows-x64, linux-x64, linux-arm64, macos-arm64, macos-x64.
#
# To bump a tool: take a release at least one day old, re-hash every platform asset, and check that the
# entry still names the executable. Only the subset of TOML parsed by slopproof/tools/TomlSubset.kt is allowed.

