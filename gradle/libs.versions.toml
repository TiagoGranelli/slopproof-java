# Every version is pinned exactly and is at least one day old when added (release quarantine, see
# docs/agents/dependencies.md). Spring Boot's BOM pins the libraries it manages (jOOQ, Flyway, the
# PostgreSQL driver, JUnit, Jackson); the jOOQ and Flyway entries below must match the BOM, because the
# build-time code generator in build-logic runs outside it.
[versions]
java = "25"
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
jooq = "3.21.7"
flyway = "12.4.0"
postgresql = "42.7.13"
embedded-postgres = "2.2.2"
embedded-postgres-binaries = "18.6.0"
openapi-generator = "7.26.0"
errorprone = "2.50.0"
errorprone-gradle = "5.1.1"
nullaway = "0.14.2"
jspecify = "1.0.1"
checkstyle = "14.3.0"
pmd = "7.28.0"
spotbugs = "4.10.4"
spotbugs-gradle = "6.5.12"
findsecbugs = "1.14.0"
spotless = "8.10.3"
google-java-format = "1.36.0"
# wp:format 1.37.0 turned JavaFormatterOptions.Style into a record; spotless-lib 4.10.x (Spotless 8.10.3) still calls
# Style.valueOf and fails with NoSuchMethodError. Stay on 1.36.0 until a spotless-lib release supports 1.37.
# wp:format (released 2025-12-15, Kotlin scripts and build-logic sources; runs on the JDK 25 toolchain)
ktlint = "1.8.0"
archunit = "1.5.1"
jqwik = "1.10.1"
swagger-request-validator = "3.0.0"
pitest = "1.30.0"
pitest-junit5 = "1.2.3"
pitest-gradle = "1.19.0"
cyclonedx = "3.5.0"
license-report = "3.1.4"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "embedded-postgres" }
embedded-postgres-binaries-bom = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "embedded-postgres-binaries" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
swagger-request-validator-mockmvc = { module = "com.atlassian.oai:swagger-request-validator-mockmvc", version.ref = "swagger-request-validator" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
findsecbugs = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
pitest-junit5 = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5" }
# Build-time code generation (used by build-logic, outside the Spring Boot BOM).
jooq-codegen = { module = "org.jooq:jooq-codegen", version.ref = "jooq" }
jooq-meta = { module = "org.jooq:jooq-meta", version.ref = "jooq" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-gradle" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-gradle" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-gradle" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
license-report = { id = "com.github.jk1.dependency-license-report", version.ref = "license-report" }
