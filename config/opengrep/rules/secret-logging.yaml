# Gate: a logger call (log, logger, LOG) with a variable named like a password, secret, token or API key.
# A string literal argument is a message and is not flagged.
# Run: opengrep scan --config config/opengrep --error --taint-intrafile --disable-version-check src/main/java
# Test: opengrep test --taint-intrafile config/opengrep/rules (the .java beside a rule marks findings with ruleid: and clean lines with ok:)
rules:
  - id: secret-logging
    languages: [java]
    severity: ERROR
    message: >-
      A variable named like a password, secret, token or API key goes into a log line. Log what happened
      without the value (an id, a length, the last four characters), or pass the Secret type, which prints as
      <redacted>.
    patterns:
      - pattern-either:
          - pattern: $LOGGER.$LEVEL(..., $VALUE, ...)
          - pattern: $LOGGER.$LEVEL($VALUE, ...)
      - metavariable-regex:
          metavariable: $LOGGER
          regex: ^(log|logger|LOG)$
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(trace|debug|info|warn|error)$
      # A string literal is a message, not a value: "password reset" is fine, a variable named password is not.
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!").*(password|Password|secret|Secret|token|Token|apiKey|ApiKey|apikey|API_KEY)
    metadata:
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      category: security
