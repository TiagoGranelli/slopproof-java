id: no-string-secret
language: java
ignores:
  - config/opengrep/**
severity: error
message: >-
  A String holding a password, secret, token or API key is printed by toString, a debugger and a log line. Use
  the Secret type, which redacts toString, and read its value only where it is sent.
rule:
  any:
    - kind: formal_parameter
      all:
        - has:
            field: type
            regex: '^(java\.lang\.)?String$'
        - has:
            field: name
            regex: '(?i)password|secret|token|apikey'
    - kind: field_declaration
      all:
        - has:
            field: type
            regex: '^(java\.lang\.)?String$'
        - has:
            field: declarator
            has:
              field: name
              regex: '(?i)password|secret|token|apikey'
