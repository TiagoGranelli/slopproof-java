id: no-transactional-in-api
valid:
  - |
    package com.example.slopproof.posts;

    @Service
    class PostService {
      @Transactional
      public void publish() {}
    }
  - |
    package com.example.slopproof.posts;

    @RestController
    class PostsController {
      public void create() {}
    }
invalid:
  - |
    package com.example.slopproof.posts;

    @Transactional
    @RestController
    class PostsController {
      public void create() {}
    }
  - |
    package com.example.slopproof.posts;

    @RestController
    class PostsController {
      @Transactional(readOnly = true)
      public void list() {}
    }
  - |
    package com.example.slopproof.web;

    @Controller
    class PageController {
      @Transactional
      public String show() { return "page"; }
    }
