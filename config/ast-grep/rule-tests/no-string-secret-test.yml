id: no-string-secret
valid:
  - |
    class Login {
      Login(Secret password, String username) {}
      private final Secret apiKey;
      private final String username;
    }
invalid:
  - |
    class Login {
      Login(String password) {}
    }
  - |
    class Login {
      private final String apiKey;
    }
  - |
    class Login {
      private String refreshToken;
    }
  - |
    class Login {
      void connect(String clientSecret) {}
    }
